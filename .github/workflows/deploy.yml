name: Deploy Astro to GitHub Pages

on:
  # Löst den Workflow bei einem Push auf den main-Branch aus
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the project
        run: pnpm quality && pnpm build

      - name: Check generated links
        continue-on-error: true
        run: pnpm check:links

      - name: Lighthouse audit
        continue-on-error: true
        run: pnpm audit:lighthouse

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Hier sicherstellen, dass das dist-Verzeichnis verwendet wird
